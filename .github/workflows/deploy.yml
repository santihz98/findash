# Pipeline de CI/CD para el backend de FinDash — AWS (ECS Fargate + ECR + RDS).
#
# Reemplaza a cloudbuild.yaml (GCP) desde la Sesión 8: la cuenta de
# facturación de GCP quedó bloqueada por el error OR-CBAT-23 y no se
# resolvió — ver PROGRESS.md Sesión 8 para el detalle completo del pivot.
# cloudbuild.yaml se conserva en infra/gcp/cloudbuild.yaml.bak, sin borrar.
#
# Flujo (mismos pasos lógicos que cloudbuild.yaml validaba, adaptados a
# GitHub Actions): install -> prisma generate -> test contra Postgres
# efímero (con el gate de cobertura real, `test:cov`) -> build de la
# imagen Docker -> push a ECR, tageada con el SHA del commit y con
# `latest` -> redeploy explícito del servicio ECS Fargate
# (`aws ecs update-service --force-new-deployment`) -> espera a que la
# tarea nueva quede estable (`aws ecs wait services-stable`).
#
# SÍ hay un step de deploy explícito acá (Sesión 9.5) — a diferencia de
# cloudbuild.yaml, que también lo tenía (`gcloud run deploy`), la primera
# versión de este workflow (Sesión 8, cómputo en App Runner) no lo
# necesitaba: App Runner, con AutoDeploymentsEnabled=true, vigilaba el tag
# `latest` de ECR por su cuenta y redesplegaba solo con cada push. Tras el
# pivot de App Runner a ECS Fargate (Sesión 9, ver PROGRESS.md), eso dejó
# de ser cierto: ECS Fargate sigue corriendo la tarea con la que se creó
# sin importar cuántas veces este pipeline suba una imagen nueva a ECR,
# hasta que algo le ordene explícitamente reemplazarla — de ahí los dos
# steps nuevos al final de `build-and-push`.
#
# Autenticación a AWS vía OIDC (aws-actions/configure-aws-credentials) —
# nunca access keys de larga duración guardadas como secreto de GitHub.
# Los 3 secretos que este workflow necesita (Settings > Secrets and
# variables > Actions):
#   AWS_DEPLOY_ROLE_ARN  arn:aws:iam::683342010199:role/findash-github-actions-deploy
#   AWS_REGION            us-east-2
#   ECR_REPOSITORY        findash-backend
#
# El rol findash-github-actions-deploy necesita permiso de ECS
# (ecs:UpdateService + ecs:DescribeServices sobre el ARN del servicio,
# esta última porque `aws ecs wait services-stable` hace polling de
# DescribeServices) para que los dos steps nuevos de redeploy funcionen.
# Pendiente de aplicar manualmente — ver PROGRESS.md Sesión 9.5 para el
# comando exacto (mismo patrón que el resto de la infraestructura de este
# proyecto: se documenta el comando, no se corre desde acá).

name: Deploy

on:
  push:
    branches: [main]

# Nota: `id-token: write` NO va acá a nivel de workflow completo — el job
# `test` no llama a ninguna acción de AWS y no necesita ese permiso; sería
# un over-grant innecesario (mismo criterio de mínimo privilegio que ya
# rige, por ejemplo, en las policies IAM de aws-setup.sh, que apuntan a
# ARNs específicos de Secrets Manager en vez de "*"). `id-token: write` se
# declara solo en el job `build-and-push`, el único que corre
# `aws-actions/configure-aws-credentials` — ver ese job más abajo.
permissions:
  contents: read

jobs:
  test:
    name: Test (Postgres real + cobertura)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Postgres efímero para los tests de integración real (Prisma repos,
    # concurrencia, idempotencia, anti-fraude, dashboard) — mismo motivo
    # que test-db-up/test-db-wait en cloudbuild.yaml, pero acá GitHub
    # Actions maneja el healthcheck nativamente vía `options:
    # --health-cmd`, sin necesidad de replicar el loop manual de
    # `pg_isready` que cloudbuild.yaml sí necesitaba (ahí no existía un
    # equivalente nativo a `services:`).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: findash
          POSTGRES_PASSWORD: findash_test_password
          POSTGRES_DB: findash_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U findash -d findash_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://findash:findash_test_password@localhost:5432/findash_test?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generar Prisma Client
        run: npm run prisma:generate

      - name: Migrar el Postgres efímero
        run: npm run prisma:migrate:deploy

      # Gate de cobertura real (Sesión 8): `test:cov`, no `test` a secas.
      # PROGRESS.md documenta desde la Sesión 0 que esto quedaba pendiente
      # "al llegar a la Fase 6 del roadmap" — el backend ya está
      # funcionalmente completo (RF-01 a RF-08), corresponde activarlo
      # ahora. El umbral (80% branches/functions/lines/statements,
      # package.json > jest.coverageThreshold) es GLOBAL, no por archivo;
      # confirmado localmente en 99%+ antes de activar este gate en CI
      # (ver PROGRESS.md Sesión 8 para el detalle archivo por archivo de
      # las pocas ramas defensivas que quedan sin cubrir a propósito).
      - name: Tests con cobertura (gate real, no solo humo)
        run: npm run test:cov

  build-and-push:
    name: Build + push a ECR
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Configurar credenciales de AWS (OIDC, sin access keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login a ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # Dos tags por la misma imagen: el SHA del commit (para poder
      # rastrear exactamente qué commit está desplegado en un momento
      # dado — trazabilidad, no solo despliegue) y `latest`. A diferencia
      # de App Runner (Sesión 8, ya no en uso), ECS Fargate no vigila este
      # tag por su cuenta — subir `latest` acá no alcanza para que el
      # servicio se entere; de ahí los dos steps siguientes.
      - name: Build y push de la imagen
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" \
            .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

      # Redespliega el servicio ECS con la imagen recién subida. ECS
      # Fargate sigue corriendo la tarea con la que se creó (o con la del
      # último redeploy) sin importar cuántas veces se suba una imagen
      # nueva a ECR — este step es el que le dice explícitamente "hay una
      # imagen nueva, reemplazá la tarea actual". Reutiliza las
      # credenciales OIDC ya configuradas arriba en este mismo job, no
      # hace falta autenticarse de nuevo.
      - name: Redesplegar el servicio ECS (force-new-deployment)
        run: |
          aws ecs update-service \
            --cluster findash-cluster \
            --service findash-backend-service \
            --force-new-deployment \
            --region ${{ secrets.AWS_REGION }}

      # Bloquea el job hasta que la tarea nueva esté RUNNING y en steady
      # state, o hasta timeout. Si la imagen nueva no levanta (crashea al
      # arrancar, falla el health check, etc.), este step falla y el
      # workflow completo se reporta como fallido — en vez de terminar en
      # verde con el redeploy "disparado" pero el servicio roto en
      # producción.
      - name: Esperar a que el servicio quede estable
        run: |
          aws ecs wait services-stable \
            --cluster findash-cluster \
            --service findash-backend-service \
            --region ${{ secrets.AWS_REGION }}
